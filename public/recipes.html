<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Recipe Details</title>
  <!-- Icon link -->
  <link rel = "icon" href = "images/chef-icon.png" type = "image/png">
  <!--Bootstrap 5 integration -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Link to css -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-beige text-dark">
  <!--navigation bar-->
  <nav class="navbar navbar-expand-lg navbar-light bg-white p-4">
    <div class="container-fluid">
      <a class="navbar-brand text-burgundy" href="#">Molka's Recipe Book</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link text-burgundy" aria-current="page" href="home.html" target="_blank">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-burgundy" href="about.html" target="_blank">About</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main content -->
  <div class="container my-5">
    <div id="recipe-details">
      <!-- Recipe details will be inserted here dynamically -->
    </div>
  </div>

  <!--  Comments section -->
    <div class="container my-5 bg-warning-subtle text-dark">
        <h3>Comments</h3>
        <form id="comment-form" class="mb-4">
            <div class="mb-3">
                <label for="username" class="form-label">Name</label>
                <input type="text" class="form-control" id="username" required>
            </div>
            <div class="mb-3">
                <label for="comment" class="form-label">Your comment</label>
                <textarea id="comment" class="form-control" id="comment" rows="3" required></textarea>
            </div>
            <button type="submit" class="btn btn-burgundy">submit</button>
        </form>
        <ul class="list-group" id="comments-list">
            <!-- Comments will be inserted here dynamically -->
        </ul>
    </div>

  <!--  Bootstrap JS integration -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Link to Javascript file -->
  <script src="script.js"></script>
</body>
</html>

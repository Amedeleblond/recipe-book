
<!-- THIS IS REGISTER PAGE-->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register</title>
  <!-- Icon link -->
   <link rel = "icon" href = "images/chef-icon.png" type = "image/png">
  <!-- Bootstrap 5 integration -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Link to custom css file -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100 bg-beige text-dark">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <!-- Bootstrap card for the form -->
        <div class="card shadow-lg p-4 animated-card bg-danger-subtle rounded shadow-lg p-4">
          <h2 class="text-center mb-4">Register</h2>
          <form id="registerForm" novalidate>
            <div class="mb-3">
              <label for="name" class="form-label">Name</label>
              <input type="text" class="form-control" id="name" name="name" required>
              <div class="invalid-feedback">
                Please enter your name
              </div>
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Email address</label>
              <input type="email" class="form-control" id="email" name="email" required>
              <div class="invalid-feedback">
                Please enter a valid email address
              </div>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">password</label>
              <input type="password" class="form-control" id="password" name="password" required minlength="6">
              <div class="invalid-feedback">
                The password must contain at least 6 charaters.
              </div>
            </div>
            <button type="submit" class="btn btn-burgundy w-100">Sign in</button>
          </form>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Bootstrap JS integration -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Link to the custom javascript file -->
  <script src="script.js"></script>
</body>
</html>
